<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Affiliate Link Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'], },
                    colors: {
                        shopee: { DEFAULT: '#ee4d2d', hover: '#d73211', bg: '#f5f5f5', text: '#222222', sub: '#757575', border: '#e5e5e5', light: '#fff2f0' }
                    },
                    boxShadow: { 'shopee': '0 1px 1px 0 rgba(0,0,0,.05)', 'floating': '0 3px 10px 0 rgba(0,0,0,.1)', }
                }
            }
        }
        }
    </script>
    <style>
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #999; }
        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-enter { animation: slideDown 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-shopee-bg text-shopee-text font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-gradient-to-b from-[#f53d2d] to-[#f63] shadow-sm z-50">
        <div class="max-w-[1200px] mx-auto px-4 hidden md:flex justify-between items-center text-white/90 text-[13px] py-1.5">
            <div class="flex gap-4 items-center">
                <a href="#" class="hover:text-white transition">Seller Centre</a>
                <span class="border-l border-white/30 h-3"></span>
                <a href="#" class="hover:text-white transition">Download</a>
            </div>
            <div class="flex gap-4 items-center">
                <a href="#" class="hover:text-white transition flex items-center gap-1">Notifications</a>
                <a href="#" class="hover:text-white transition flex items-center gap-1">Help</a>
            </div>
        </div>
        <div class="max-w-[1200px] mx-auto px-4 py-4 md:py-5 flex items-center">
            <div class="flex items-center text-white cursor-pointer select-none">
                <svg class="w-8 h-8 md:w-10 md:h-10 mr-2" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6h-9c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h9c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-2 7.5h-5v-1.5h5v1.5zm0-3h-5v-1.5h5v1.5z"/></svg>
                <div class="flex items-baseline">
                    <span class="text-2xl md:text-3xl font-medium tracking-tight">Shopee</span>
                    <span class="text-xs md:text-sm font-medium border-l border-white/50 pl-2 ml-2">Affiliate Tool</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex justify-center py-6 md:py-10 px-4">
        <div class="bg-white w-full max-w-[800px] rounded-sm shadow-shopee border border-black/5 overflow-hidden flex flex-col">
            <div class="px-6 md:px-8 py-5 border-b border-shopee-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-[1.125rem] font-medium text-shopee-text capitalize">Convert Affiliate Link</h1>
                    <p class="text-[0.875rem] text-shopee-sub mt-1">Transform any Shopee product or share URL into your personal affiliate tracker.</p>
                </div>
                <div class="bg-shopee-light text-shopee px-3 py-1.5 rounded text-xs font-medium border border-shopee/20 flex items-center justify-center gap-1 w-fit">
                    Vercel + Railway API
                </div>
            </div>

            <div class="p-6 md:p-8 flex flex-col gap-6">
                <div>
                    <label class="block text-[0.875rem] font-medium text-shopee-text mb-2 flex items-center gap-1.5">Original Product or Share Link</label>
                    <textarea id="input" class="w-full h-[100px] bg-white border border-shopee-border rounded-sm p-3 text-[0.875rem] text-shopee-text placeholder-gray-400 focus:outline-none focus:border-shopee focus:ring-1 focus:ring-shopee transition-colors resize-y" placeholder="Paste the link here (e.g., https://s.shopee.ph/... or https://shopee.ph/product/...)"></textarea>
                </div>

                <div class="flex justify-end border-b border-shopee-border pb-6">
                    <button id="convert" class="w-full sm:w-auto bg-shopee hover:bg-shopee-hover text-white text-[0.875rem] font-medium py-2.5 px-8 rounded-sm shadow-sm transition-colors flex justify-center items-center gap-2">
                        <span>Generate Link</span>
                    </button>
                </div>

            </div>

            <div class="bg-gray-50 px-6 md:px-8 py-4 border-t border-shopee-border text-[0.75rem] text-shopee-sub flex justify-between items-center">
                <span>Secured with Base Shopee Affiliate ID</span>
                <span class="text-gray-400">v4.0 (Decoupled)</span>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed top-8 left-1/2 hidden z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-floating bg-white border-l-4 text-[0.875rem] font-medium text-shopee-text w-[90%] max-w-[400px]">
        <div id="toastIcon" class="shrink-0"></div>
        <span id="toastMessage">Message goes here</span>
    </div>

    <script>
        // Points strictly to your Railway backend
        const BACKEND_API_URL = "https://shopeexyt.up.railway.app/api/unshorten"; 
        
        const BASE_LINK = "https://s.shopee.ph/an_redir?affiliate_id=13339680153&origin_link=https%3A%2F%2Fshopee.ph%2Fproduct%2F98477970%2F23972212767%3Fgads_t_sig%3DgqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAM_NxfHGgeczprZR4Q8tPoOfvwhbtN63JlB369xGJA1mbqBWuW2sVWxQjSJT_xT_mbG0_W5kumedB_GGTjqmNpcGhlcnRleHTEbAAAAAwD20ZGO3UUiWJ47NHWlmMT8GusU1ySrF3aXC9XPf-58OsnuDQjBHsTBv3SSIX0NNJBuXlQItwl7HMDsXxAcAefGmqwPn2VPZA3Tjg5mSaHyD7qOWx9r-0iZvYa6UMRrw0dAyWkVIA6bQ&sub_id=YT3-mnUpOFkyGpofmhWyop_jjhMi_WY2eyebK6Svl2kZYFRytZ5F_A5gEw6E6pPRCspt_WpJMeQJkdTnLKpyolzDfVfAs4q2RXtkjqgQKHtPts2_M0xXi7qXlZ7CS4XD93IxQYkl";
        
        let toastTimeout;

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            clearTimeout(toastTimeout);
            toastMessage.textContent = message;
            
            if (type === 'error') {
                toast.className = 'fixed top-4 md:top-8 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-floating bg-white border-l-4 border-shopee text-[0.875rem] font-medium text-shopee-text toast-enter w-[90%] max-w-[400px]';
            } else if (type === 'success') {
                toast.className = 'fixed top-4 md:top-8 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-4 py-3 rounded shadow-floating bg-white border-l-4 border-[#26aa99] text-[0.875rem] font-medium text-shopee-text toast-enter w-[90%] max-w-[400px]';
            }

            toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('toast-enter');
            }, 5000);
        }

        async function unshortenViaBackend(shortUrl) {
            try {
                const response = await fetch(`${BACKEND_API_URL}?url=${encodeURIComponent(shortUrl)}`);
                
                // If it fails, read the JSON error from Railway to see exactly what broke
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `HTTP Error ${response.status}: Failed to reach backend.`);
                }
                
                const data = await response.json();
                return data.finalUrl;
            } catch (err) {
                // This catches network errors (like CORS or Railway being down completely)
                throw new Error("Backend Error: " + err.message);
            }
        }

        document.getElementById("convert").onclick = async function() {
            let inputText = document.getElementById("input").value.trim();
            const convertBtn = this;

            if (!inputText) {
                showToast("Please paste a Shopee product link first.", "error");
                return;
            }

            let urlMatch = inputText.match(/(https?:\/\/[^\s]+)/);
            let link = urlMatch ? urlMatch[1] : inputText;

            const originalContent = convertBtn.innerHTML;
            convertBtn.classList.add('opacity-80', 'cursor-not-allowed');
            convertBtn.disabled = true;

            try {
                let finalLink = link;
                
                if (link.includes('s.shopee.ph') || link.includes('shp.ee')) {
                    convertBtn.innerHTML = `Extracting Link...`;
                    finalLink = await unshortenViaBackend(link);
                } else {
                    convertBtn.innerHTML = `Generating...`;
                }

                let url = new URL(BASE_LINK);
                url.searchParams.set("origin_link", finalLink);
                const generatedLink = url.toString();

                showToast("Opening Shopee...", "success");

                // Navigate immediately in the same tab (not a new tab/window.open),
                // since a new tab is far more likely to be blocked as a popup by
                // mobile browsers, especially once we've awaited a fetch first.
                // Same-tab navigation also triggers Android/iOS app-link handoff
                // into the Shopee app reliably. The link itself is never written
                // to the page, so nothing is shown or left in the DOM.
                window.location.href = generatedLink;
            } catch (e) {
                showToast(e.message || "Invalid URL format.", "error");
            } finally {
                convertBtn.innerHTML = originalContent;
                convertBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                convertBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
